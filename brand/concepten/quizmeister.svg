<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="me-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b3f"/>
      <stop offset="1" stop-color="#0d121c"/>
    </linearGradient>
    <radialGradient id="me-spot" cx="560" cy="360" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa53d" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#ffa53d" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffa53d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="me-head" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#c9d0df"/>
      <stop offset="1" stop-color="#6b7590"/>
    </radialGradient>
    <linearGradient id="me-handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151b28"/>
      <stop offset=".3" stop-color="#46516f"/>
      <stop offset=".55" stop-color="#2a3349"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="me-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c46a0b"/>
      <stop offset=".35" stop-color="#ffc77f"/>
      <stop offset=".6" stop-color="#ffa53d"/>
      <stop offset="1" stop-color="#b85f08"/>
    </linearGradient>
    <pattern id="me-mesh" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 H34 M0 0 V34" stroke="#1a2131" stroke-opacity=".32" stroke-width="7"/>
