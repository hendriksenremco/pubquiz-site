# Elke push naar master zet de site live op Firebase Hosting (quiznote.app).
name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Vanuit app-release.yml, met de commit die net op master is gezet.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm generate
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUIZNOTE_4C3E8 }}
          projectId: quiznote-4c3e8
          channelId: live
